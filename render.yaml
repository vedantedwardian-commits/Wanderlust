# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wanderlust
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /privacy
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: SESSION_SECRET
        generateValue: true
      # Secrets below are entered in the Render dashboard on first deploy
      - key: ATLASDB_URI
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
