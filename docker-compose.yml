services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Use the bundled MongoDB container instead of the URI in .env
      ATLASDB_URI: mongodb://mongo:27017/wanderlust
      MONGO_URL: mongodb://mongo:27017/wanderlust
      PORT: 8080
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
